[project]
name = "flask-mongoengine2"
description = "Flask extension that provides integration with MongoEngine."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Framework :: Flask",
]
dependencies = [
  "Flask>=3.1.0",
  # mongoengine<0.29.1 cannot be imported with recent pymongo versions.
  "mongoengine>=0.29.1,<0.30",
  "pymongo>=4.18.3,<5",
]
keywords = ["flask", "mongo", "pymongo", "mongoengine", "extension"]
maintainers = [
  {name = "Ahmet Elgün", email = "ahmetelgn@gmail.com"}
]
dynamic = ["version"]

[project.optional-dependencies]
toolbar = ["Flask-DebugToolbar>=0.15.0"]
dev = [
  "pre-commit",
  "pytest>=8",
  "pytest-cov",
  "pytest-mock",
  "nox",
]

[project.urls]
Homepage = "https://github.com/ahmetelgun/flask-mongoengine2"
Documentation = "https://flask-mongoengine2.readthedocs.io"
Repository = "https://github.com/ahmetelgun/flask-mongoengine2"
Changelog = "https://github.com/ahmetelgun/flask-mongoengine2/releases"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["flask_mongoengine2*"]

[tool.setuptools_scm]
version_file = "flask_mongoengine2/_version.py"
version_scheme = "release-branch-semver"
local_scheme = "no-local-version"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
# RUF012: mongoengine uses mutable class level `meta` dicts by design.
ignore = ["E501", "RUF012"]

[tool.ruff.lint.mccabe]
max-complexity = 17

[tool.pytest.ini_options]
addopts = "--cov=flask_mongoengine2 --cov-report=term-missing"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore::ResourceWarning",
]

[tool.coverage.run]
omit = ["flask_mongoengine2/_version.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "def __repr__",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
